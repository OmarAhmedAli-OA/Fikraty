name: fikraty
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Lottie animations
  lottie: ^3.6.1
  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^3.0.0

  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # Supabase
  supabase_flutter: ^2.10.3

  # Networking and local storage
  http: ^1.1.0
  shared_preferences: ^2.2.2

  # UI and utilities
  auto_text_resizer: ^1.0.1
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  image_picker: ^1.0.7
  popover: ^0.5.1
  salomon_bottom_bar: ^3.3.2
  staggered_grid_view_flutter: ^0.0.4
  uuid: ^4.5.1
  chat_bubbles: ^1.5.0
  google_generative_ai: ^0.4.7

  # Architecture
  dio: ^5.9.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  permission_handler: ^13.0.2
  audioplayers: ^6.8.1
  record: ^7.1.2
  path_provider: ^2.1.6
  camera: ^0.12.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.8
  mocktail_image_network: ^1.0.2
  flutter_native_splash: ^2.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/icons/app_mark.png
    - assets/icons/splash_logo.png
    - assets/icons/app_icon.png
    - assets/animations/

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash_logo.png"
  android: true
  ios: true
  web: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/splash_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/splash_logo.png"

