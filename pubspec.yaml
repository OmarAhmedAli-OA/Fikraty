name: fikraty
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^3.0.0

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2

  # Supabase
  supabase_flutter: ^2.10.3

  # Networking and local storage
  http: ^1.1.0
  shared_preferences: ^2.2.2

  # UI and utilities
  auto_text_resizer: ^1.0.1
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  image_picker: ^1.0.7
  popover: ^0.4.0
  salomon_bottom_bar: ^3.3.2
  staggered_grid_view_flutter: ^0.0.4
  uuid: ^4.5.1
  chat_bubbles: ^1.5.0
  google_generative_ai: ^0.4.7

  # Architecture
  dio: ^5.9.0
  get_it: ^9.3.0
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.8
  mocktail_image_network: ^1.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Logo.jpg"
